{% extends "base.html" %}
{% block title %}{{ 'Editar' if item else 'Nuevo' }} Insumo{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">
    <i class="bi bi-{{ 'pencil' if item else 'plus-circle' }} me-2 text-warning"></i>
    {{ 'Editar Insumo' if item else 'Nuevo Insumo' }}
  </h2>
  <a href="{{ url_for('inventory.index') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>

<div class="card shadow-sm" style="max-width:600px;">
  <div class="card-body p-4">
    <form method="POST"
          action="{{ url_for('inventory.edit_item', item_id=item.id) if item else url_for('inventory.create_item') }}"
          novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Nombre *</label>
          <input type="text" name="name" class="form-control" required
                 value="{{ item.name if item else '' }}" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Unidad *</label>
          <select name="unit" class="form-select">
            {% for u in ['kg', 'g', 'L', 'mL', 'pza', 'caja', 'bolsa'] %}
            <option value="{{ u }}" {% if item and item.unit == u %}selected{% endif %}>{{ u }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Costo Unitario ($)</label>
          <input type="number" name="unit_cost" class="form-control" min="0" step="0.0001"
                 value="{{ item.unit_cost if item else '0.0000' }}" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Stock Actual</label>
          <input type="number" name="stock" class="form-control" min="0" step="0.001"
                 value="{{ item.stock if item else '0.000' }}"
                 {% if item %}readonly{% endif %} />
          {% if item %}<small class="text-muted">Usa Movimientos para ajustar.</small>{% endif %}
        </div>
        <div class="col-md-6">
          <label class="form-label">Stock Mínimo (alerta)</label>
          <input type="number" name="min_stock" class="form-control" min="0" step="0.001"
                 value="{{ item.min_stock if item else '10.000' }}" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Fecha de Caducidad</label>
          <input type="date" name="expiry_date" class="form-control"
                 value="{{ item.expiry_date.isoformat() if item and item.expiry_date else '' }}" />
        </div>
        <div class="col-12">
          <label class="form-label">Proveedor</label>
          <input type="text" name="supplier" class="form-control"
                 value="{{ item.supplier or '' }}" />
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-warning fw-bold w-100">
            <i class="bi bi-check-circle me-1"></i>
            {{ 'Guardar Cambios' if item else 'Crear Insumo' }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
