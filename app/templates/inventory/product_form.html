{% extends "base.html" %}
{% block title %}{{ 'Editar' if product else 'Nuevo' }} Platillo{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">
    <i class="bi bi-egg-fried me-2 text-warning"></i>
    {{ 'Editar Platillo' if product else 'Nuevo Platillo' }}
  </h2>
  <a href="{{ url_for('inventory.products') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>

<div class="card shadow-sm" style="max-width:560px;">
  <div class="card-body p-4">
    <form method="POST"
          action="{{ url_for('inventory.edit_product', product_id=product.id) if product else url_for('inventory.create_product') }}"
          novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">Nombre *</label>
        <input type="text" name="name" class="form-control" required
               value="{{ product.name if product else '' }}" />
      </div>
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label">Precio de Venta ($) *</label>
          <input type="number" name="price" class="form-control" min="0" step="0.01" required
                 value="{{ product.price if product else '0.00' }}" />
        </div>
        <div class="col-6">
          <label class="form-label">Costo Estimado ($)</label>
          <input type="number" name="cost" class="form-control" min="0" step="0.01"
                 value="{{ product.cost if product else '0.00' }}" />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select name="category_id" class="form-select">
          <option value="">-- Sin categoría --</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>
            {{ cat.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="description" class="form-control" rows="2">{{ product.description or '' if product else '' }}</textarea>
      </div>
      {% if product %}
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" name="is_available" id="isAvailable"
               {% if product.is_available %}checked{% endif %} />
        <label class="form-check-label" for="isAvailable">Disponible en menú</label>
      </div>
      {% endif %}
      <button type="submit" class="btn btn-warning fw-bold w-100">
        <i class="bi bi-check-circle me-1"></i>
        {{ 'Guardar Cambios' if product else 'Crear Platillo' }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
