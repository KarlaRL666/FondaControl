{% extends "base.html" %}
{% block title %}Nuevo Usuario{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0"><i class="bi bi-person-plus me-2 text-warning"></i>Nuevo Usuario</h2>
  <a href="{{ url_for('auth.users') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>

<div class="card shadow-sm" style="max-width:560px;">
  <div class="card-body p-4">
    <form method="POST" action="{{ url_for('auth.create_user') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">Usuario *</label>
        <input type="text" name="username" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Email *</label>
        <input type="email" name="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña *</label>
        <input type="password" name="password" class="form-control" required minlength="8" />
      </div>
      <div class="mb-3">
        <label class="form-label">Rol</label>
        <select name="role" class="form-select">
          <option value="cajero">Cajero</option>
          <option value="cocinero">Cocinero</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <button type="submit" class="btn btn-warning fw-bold w-100">
        <i class="bi bi-check-circle me-1"></i>Crear Usuario
      </button>
    </form>
  </div>
</div>
{% endblock %}
