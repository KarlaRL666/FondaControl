{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block unauth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-lg" style="max-width:420px;width:100%;">
    <div class="card-header bg-warning text-dark text-center py-4">
      <i class="bi bi-cup-hot-fill fs-2 me-2"></i>
      <h4 class="mb-0 d-inline-block fw-bold">FondaControl</h4>
      <p class="mb-0 small mt-1">Sistema POS &amp; Control Productivo</p>
    </div>
    <div class="card-body p-4">
      <h5 class="text-center mb-4">Iniciar Sesión</h5>
      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="tu_usuario" required autocomplete="username" />
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="btn btn-outline-secondary" id="togglePwd">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember" name="remember" />
          <label class="form-check-label" for="remember">Recordarme</label>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('togglePwd').addEventListener('click', function () {
  const pwd = document.getElementById('password');
  const icon = this.querySelector('i');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    pwd.type = 'password';
    icon.classList.replace('bi-eye-slash', 'bi-eye');
  }
});
</script>
{% endblock %}
