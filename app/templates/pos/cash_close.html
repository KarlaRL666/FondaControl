{% extends "base.html" %}
{% block title %}Cierre de Caja{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0"><i class="bi bi-wallet2 me-2 text-warning"></i>Cierre de Caja</h2>
  <a href="{{ url_for('pos.index') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>POS
  </a>
</div>

<div class="card shadow-sm" style="max-width:560px;">
  <div class="card-body p-4">
    <p class="text-muted mb-4">
      Registra el cierre del turno. El sistema calculará automáticamente los totales del día.
    </p>
    <form method="POST" action="{{ url_for('pos.cash_close') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">Fondo inicial en caja ($)</label>
        <input type="number" name="opening_balance" class="form-control" min="0" step="0.01" value="0.00" />
      </div>
      <div class="mb-3">
        <label class="form-label">Notas del turno</label>
        <textarea name="notes" class="form-control" rows="3" placeholder="Observaciones, incidencias..."></textarea>
      </div>
      <button type="submit" class="btn btn-warning fw-bold w-100">
        <i class="bi bi-check-circle me-1"></i>Registrar Cierre
      </button>
    </form>
  </div>
</div>
{% endblock %}
