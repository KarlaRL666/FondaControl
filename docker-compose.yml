version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - MYSQL_HOST=mysql
      - MONGO_URI=mongodb://mongo:27017/fondacontrol_logs
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - uploads:/app/app/static/uploads
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fondacontrol_db
      MYSQL_USER: fondacontrol
      MYSQL_PASSWORD: fondapassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
  uploads:
